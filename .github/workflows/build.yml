name: Build APK

# Se ejecuta al hacer push o pull request hacia main/master, y también se
# puede lanzar manualmente desde la pestaña Actions ("workflow_dispatch").
# Genera el APK debug y publica los reportes de tests/lint como artefactos.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar (clean)
        run: ./gradlew clean

      - name: Ejecutar tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Ejecutar lint
        run: ./gradlew lintDebug

      - name: Generar APK debug
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GraficosDivertidos-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Subir reporte de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
